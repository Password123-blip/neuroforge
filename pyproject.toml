[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroforge"
version = "0.1.0"
description = "A neural-network toolkit written from scratch on NumPy: autograd, layers, optimisers, and MLP/CNN/RNN/GPT models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashutosh Kumar Singh" }]
keywords = ["deep-learning", "neural-networks", "autograd", "numpy", "transformer", "from-scratch", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
]
plot = [
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/Password123-blip/neuroforge"

[tool.setuptools.packages.find]
include = ["neuroforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
